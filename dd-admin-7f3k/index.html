<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Admin · Dil & Dastaan</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--ol:#3f5041;--te:#bc6c52;--go:#d4a017;--cr:#f4f1e8;--pe:#f8cbb6}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Merriweather,Georgia,serif;background:var(--cr);color:var(--ol)}
#lg{min-height:100vh;display:grid;place-items:center;background:var(--ol)}#lg form{background:var(--cr);padding:36px;border-radius:20px;width:min(380px,92vw);display:grid;gap:12px;animation:up .6s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}#lg img{height:40px;margin:auto}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #3f504155;border-radius:10px;font:inherit;background:#fff;color:var(--ol)}textarea{min-height:90px}
button{font:700 14px Merriweather,serif;padding:10px 18px;border-radius:99px;border:2px solid var(--ol);background:var(--ol);color:var(--cr);cursor:pointer;transition:.2s}button:hover{transform:translateY(-2px)}
button.g{background:none;color:var(--ol)}button.d{background:var(--te);border-color:var(--te)}button.s{background:var(--go);border-color:var(--go);color:var(--ol)}
#db{display:none;min-height:100vh;grid-template-columns:230px 1fr}aside{background:var(--ol);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}aside img{height:34px;margin:0 0 18px 8px}
aside a{display:block;color:var(--cr);padding:10px 14px;border-radius:10px;cursor:pointer;text-transform:capitalize}aside a:hover,aside a.on{background:#ffffff22;color:var(--go)}
main{padding:0 28px 60px;min-width:0}.top{position:sticky;top:0;background:var(--cr);padding:16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #3f504133;z-index:2}.top b{margin-right:auto;font-size:18px;text-transform:capitalize}
fieldset{border:1px solid #3f504144;border-radius:14px;margin:14px 0;padding:14px 18px;background:#fff8}legend{font-weight:700;color:var(--te);text-transform:capitalize;padding:0 8px}label{display:block;font-size:12px;margin:10px 0 4px;text-transform:capitalize;color:#697267}
.it{border-left:4px solid var(--go);padding-left:12px;margin:12px 0}.ih{display:flex;gap:6px;align-items:center}.ih b{margin-right:auto}.ih button{padding:3px 10px}
#t{position:fixed;bottom:20px;right:20px;background:var(--ol);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.4s;pointer-events:none}#t.on{opacity:1}.err{color:#b3261e;min-height:20px;font-size:13px}.box{max-width:480px}
@media(max-width:800px){#db{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap}}
@media(prefers-color-scheme:dark){:root{--cr:#192019;--ol:#ece8dc}body{background:#192019;color:#ece8dc}input,textarea,select{background:#243026;color:#ece8dc;border-color:#ece8dc44}fieldset{background:#243026}aside{background:#121812}#lg{background:#121812}#lg form{background:#192019}.top{background:#192019}button{background:#d4a017;border-color:#d4a017;color:#1b1b14}button.g{background:none;color:#ece8dc;border-color:#ece8dc88}button.d{background:#e08c70;border-color:#e08c70;color:#1b1b14}label{color:#b0b6a8}}aside a{color:#f4f1e8!important}aside a:hover,aside a.on{color:#d4a017!important}</style></head><body>
<div id="lg"><form id="lf"><img src="../assets/logo.png" alt=""><h3 style="text-align:center;margin:0">Admin sign in</h3><input id="u" placeholder="Username" autocomplete="username" required><input id="p" type="password" placeholder="Password" autocomplete="current-password" required><div class="err" id="er"></div><button>Sign in</button></form></div>
<div id="db"><aside><img src="../assets/logo-light.png" alt=""><div id="tabs"></div></aside><main><div class="top"><b id="ttl"></b><button class="s" id="sv">Save</button><button class="g" id="dl">Download content.js</button><button class="g" id="im">Import</button><button class="g" id="pv">Preview site</button><button class="d" id="rs">Reset</button><button class="g" id="lo">Log out</button><input type="file" id="fi" accept=".json,.js" hidden></div><div id="pn"></div></main></div><div id="t"></div>
<script src="../assets/content.js"></script><script>
const DEF='bf6b5bdb74c79ece9fc0ad0ac9fb0359f9555d4f35a83b2e6ec69ae99e09603d',$=i=>document.getElementById(i);
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const cr=()=>{try{return JSON.parse(localStorage.getItem('dd_cred'))||{u:'admin',h:DEF}}catch(x){return{u:'admin',h:DEF}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
let C,tab,dirty=0,fails=+sessionStorage.dd_f||0,lock=+sessionStorage.dd_l||0;
const load=()=>{try{C=JSON.parse(localStorage.getItem('dd_content'));if(C._v!==DD_CONTENT._v)C=null}catch(x){C=null}C=C||JSON.parse(JSON.stringify(DD_CONTENT))};
lf.onsubmit=async ev=>{ev.preventDefault();if(Date.now()<lock){er.textContent='Too many attempts. Wait a moment.';return}
 const c=cr();if(u.value===c.u&&await H(u.value+':'+p.value)===c.h){sessionStorage.dd_a='1';sessionStorage.dd_f=0;start()}
 else{fails++;sessionStorage.dd_f=fails;er.textContent='Incorrect username or password.';if(fails>=5){lock=Date.now()+30000;sessionStorage.dd_l=lock;fails=0;sessionStorage.dd_f=0;er.textContent='Locked for 30 seconds.'}}};
function start(){load();lg.style.display='none';db.style.display='grid';tabs.innerHTML=[...Object.keys(C).filter(k=>k[0]!='_'),'account'].map(k=>`<a data-k="${k}">${k}</a>`).join('');tabs.onclick=x=>x.target.dataset.k&&go(x.target.dataset.k);go(Object.keys(C).find(k=>k[0]!='_'))}
const get=p=>p.reduce((o,k)=>o[k],C);
function R(v,p,l){const a=esc(JSON.stringify(p));
 if(Array.isArray(v)){return`<fieldset><legend>${l}</legend>${v.map((x,i)=>`<div class="it"><div class="ih"><b>${esc(typeof x=='object'?(x.name||x.title||x.step||x.sdg||'Item'):'Item')} #${i+1}</b><button class="g" data-a="up" data-p='${esc(JSON.stringify([...p,i]))}'>↑</button><button class="g" data-a="dn" data-p='${esc(JSON.stringify([...p,i]))}'>↓</button><button class="d" data-a="del" data-p='${esc(JSON.stringify([...p,i]))}'>Delete</button></div>${R(x,[...p,i],'')}</div>`).join('')}<button class="g" data-a="add" data-p='${a}'>+ Add item</button></fieldset>`}
 if(v&&typeof v=='object')return`<fieldset>${l?`<legend>${l}</legend>`:''}${Object.keys(v).map(k=>R(v[k],[...p,k],k.replace(/([A-Z])/g,' $1'))).join('')}</fieldset>`;
 const s=String(v);return`<label>${l}</label>${s.length>70||s.includes('\n')?'<textarea':'<input'} data-p='${a}'${s.length>70||s.includes('\n')?'>'+esc(s)+'</textarea>':` value="${esc(s)}">`}`}
function go(k){tab=k;ttl.textContent=k;[...tabs.children].forEach(a=>a.classList.toggle('on',a.dataset.k==k));
 if(k=='account'){pn.innerHTML=`<div class="box"><fieldset><legend>Change username &amp; password</legend><label>Current password</label><input id="cp" type="password"><label>New username</label><input id="nu" value="${esc(cr().u)}"><label>New password (min 8 characters)</label><input id="np" type="password"><label>Confirm new password</label><input id="nc" type="password"><div class="err" id="ae"></div><button id="ca">Update credentials</button></fieldset><p style="font-size:13px">Credentials are stored in this browser. See README for real protection.</p></div>`;ca.onclick=chg;return}
 pn.innerHTML=R(C[k],[k],'')}
pn.addEventListener('input',x=>{const p=x.target.dataset.p;if(p){const q=JSON.parse(p),l=q.pop();get(q)[l]=x.target.value;dirty=1}});
pn.addEventListener('click',x=>{const b=x.target.closest('button[data-a]');if(!b)return;const q=JSON.parse(b.dataset.p),a=b.dataset.a;dirty=1;
 if(a=='add'){const arr=get(q),tp=arr[0],bl=o=>Array.isArray(o)?[]:typeof o=='object'?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,bl(v)])):'';arr.push(tp===undefined?'':bl(tp))}
 else{const i=q.pop(),arr=get(q);if(a=='del'){if(confirm('Delete this item?'))arr.splice(i,1)}else{const j=a=='up'?i-1:i+1;if(j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]]}}go(tab)});
sv.onclick=()=>{localStorage.setItem('dd_content',JSON.stringify(C));dirty=0;toast('Saved in this browser')};
dl.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['window.DD_CONTENT='+JSON.stringify(C,null,2)+';'],{type:'text/javascript'}));a.download='content.js';a.click();toast('Replace assets/content.js with this file to publish')};
im.onclick=()=>fi.click();fi.onchange=async()=>{try{let s=await fi.files[0].text();s=s.replace(/^[^{]*/,'').replace(/;?\s*$/,'');C=JSON.parse(s);dirty=1;go(Object.keys(C).find(k=>k[0]!='_'));toast('Imported. Press Save.')}catch(x){toast('Invalid file')}};
pv.onclick=()=>open('../index.html','_blank');rs.onclick=()=>{if(confirm('Discard saved edits and restore the original content?')){localStorage.removeItem('dd_content');load();go(Object.keys(C).find(k=>k[0]!='_'));toast('Reset')}};
lo.onclick=()=>{sessionStorage.removeItem('dd_a');location.reload()};
async function chg(){const c=cr(),n=nu.value.trim();if(await H(c.u+':'+cp.value)!==c.h)return ae.textContent='Current password is wrong.';
 if(n.length<3)return ae.textContent='Username too short.';if(np.value.length<8)return ae.textContent='Password must be at least 8 characters.';if(np.value!==nc.value)return ae.textContent='Passwords do not match.';
 localStorage.setItem('dd_cred',JSON.stringify({u:n,h:await H(n+':'+np.value)}));toast('Credentials updated');go('account')}
addEventListener('beforeunload',x=>{if(dirty)x.preventDefault()});if(sessionStorage.dd_a)start();
</script></body></html>
